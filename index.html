<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordjagt">
<meta name="theme-color" content="#2E86AB">
<title>Ordjagt</title>
<style>
  :root{
    --sea:#1BA0D6; --sea-deep:#0E77A6; --sea-light:#5FD7F0;
    --paper:#FFEFC9; --paper-2:#FFF8E7; --parch-edge:#D9A752;
    --ink:#3A2B1E; --ink-soft:#7A5C38; --ink-faint:#A08A68;
    --sand:#FFD87A; --sand-dark:#F0AE3F; --palm:#3FBF5B; --palm-dark:#249445;
    --gold:#FFC61A; --gold-dark:#D18B00; --hull:#B06B2E; --hull-dark:#7A431A;
    --red:#FF4D4D; --red-soft:#FFE1E1;
    --display:"Bookman Old Style",Georgia,"Times New Roman",serif;
    --body:system-ui,-apple-system,"Segoe UI",sans-serif;
    --lvl:var(--sea-deep);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:#5CC3DE;background-attachment:fixed;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='96'><g fill='none' stroke='%23ffffff' stroke-opacity='0.3' stroke-width='3.5' stroke-linecap='round'><path d='M10 26 q10 -8 20 0 q10 8 20 0'/><path d='M82 66 q10 -8 20 0 q10 8 20 0'/></g></svg>"),
      linear-gradient(180deg,#5CC3DE,#5CC3DE);
    color:var(--ink);font-family:var(--body);font-weight:600;overflow-x:hidden;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
  .screen{display:none;flex:1;flex-direction:column;padding:14px 16px 26px}
  .screen.on{display:flex}
  h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}

  /* ---------- søkortet ---------- */
  .banner{
    background:#FBF0D8;border:3.5px solid #3E2F26;border-radius:14px;
    padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  .brand{font-family:var(--display);font-size:29px;font-weight:700;line-height:1;letter-spacing:.5px}
  .brand em{font-style:normal;color:var(--red)}
  .purse{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800;
    font-variant-numeric:tabular-nums;color:var(--gold-dark)}
  .purse svg{width:24px;height:24px}
  .sub{color:#EAF6FC;font-size:14.5px;font-weight:600;margin:14px 4px 10px;line-height:1.55;
    text-shadow:0 1px 2px rgba(0,0,0,.35)}

  .chart{position:relative;display:flex;flex-direction:column;gap:2px;padding-bottom:20px}
  .row{display:flex;align-items:center;gap:9px;padding:2px 0}
  .row.r{flex-direction:row-reverse}
  .trail{height:56px;position:relative;display:flex;align-items:center;justify-content:center}
  .dots{display:flex;gap:8px;align-items:center}
  .trail i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
  .trail.dim i{background:rgba(255,255,255,.2)}
  .deco{position:absolute;top:2px;width:86px;height:52px;pointer-events:none;opacity:.95}
  .deco svg{width:100%;height:100%;display:block}
  .deco.l{left:-4px}
  .deco.r{right:-4px}
  .trail.dim .deco{opacity:.55}

  .isle{
    width:138px;height:120px;flex:0 0 138px;border:none;background:none;padding:0;cursor:pointer;
    position:relative;transition:transform .15s ease;
  }
  .isle svg{width:100%;height:100%;display:block;overflow:visible}
  .isle:active{transform:translateY(3px)}
  .isle:focus-visible{outline:4px solid #fff;outline-offset:2px;border-radius:12px}
  .isle.locked{cursor:default}
  .isle.locked svg{opacity:.72}
  .isle .num{font-family:var(--display);font-size:18px;font-weight:700;fill:#3E2F26}

  .meta{display:flex;flex-direction:column;gap:5px;min-width:0}
  .meta .name{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.15;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.45)}
  .meta .coins{display:flex;gap:4px}
  .meta .coins svg{width:21px;height:21px}
  .meta .hint{font-size:13px;color:#CDE6F2;font-weight:700}

  .ship{position:absolute;width:64px;height:64px;pointer-events:none;z-index:5;
    transition:transform 1.7s cubic-bezier(.45,.05,.3,1)}
  .ship svg{width:100%;height:100%;display:block}
  .ship.bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}


  /* ---- ren kontur om alle hovedformer; skyggeflader (.sh) står uden ---- */
  .isle svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]),
  .deco svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]),
  .ship svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]),
  .mate svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]),
  .chest :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]){
    stroke:#3E2F26;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke fill;
  }
  .deco svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]){stroke-width:2.2}
  .mate svg :is(path,circle,ellipse,rect):not(.sh):not([fill="none"]):not([stroke]){stroke-width:2.6}
  .purse svg circle, .meta .coins svg circle, .haul svg circle{
    stroke:#3E2F26;stroke-width:1.5;paint-order:stroke fill;
  }
  .haul svg circle{stroke-width:1.2}

  /* ---------- fælles bjælke inde på en ø ---------- */
  .bar{display:flex;align-items:center;gap:12px;padding:2px 0 16px}
  .back{width:46px;height:46px;flex:0 0 46px;border-radius:14px;border:3.5px solid #3E2F26;
    background:#FBF0D8;cursor:pointer;display:grid;place-items:center;color:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .back:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .back:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .track{flex:1;height:18px;border-radius:999px;background:rgba(9,60,86,.35);
    border:3px solid #3E2F26;overflow:hidden}
  .fill{height:100%;width:0;background:#F2C14E;transition:width .35s cubic-bezier(.2,.8,.3,1)}

  /* ---------- lær-kort ---------- */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
  .scroll{
    background:#FBF0D8;border:4px solid #3E2F26;border-radius:20px;
    padding:30px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;
    cursor:pointer;position:relative;
    box-shadow:0 6px 0 #3E2F26;
  }
  .scroll::before,.scroll::after{
    content:"";position:absolute;left:14px;right:14px;height:8px;border-radius:4px;
    background:repeating-linear-gradient(115deg,#BE8B52 0 7px,#E8C36A 7px 14px);
    border:2.5px solid #3E2F26;
  }
  .scroll::before{top:-5px}
  .scroll::after{bottom:-5px}
  .pic{font-size:100px;line-height:1.15;user-select:none}
  .word{font-family:var(--display);font-size:42px;font-weight:700;color:#3E2F26;line-height:1}
  .word-da{font-size:18px;font-weight:700;color:var(--ink-soft)}
  .speak{display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;
    color:var(--ink-soft);font-family:var(--body);font-size:14.5px;font-weight:800;padding:4px}
  .speak svg{width:21px;height:21px}
  .plank{
    width:100%;border:none;border-radius:14px;background:var(--hull);color:#FFF6E5;cursor:pointer;
    font-family:var(--display);font-size:23px;font-weight:700;padding:16px 20px;
    border:3.5px solid #3E2F26;box-shadow:0 6px 0 #3E2F26;
  }
  .plank:active{transform:translateY(4px);box-shadow:0 2px 0 #3E2F26}
  .plank:focus-visible{outline:4px solid #fff;outline-offset:3px}
  .plank.gold{background:#F2C14E;color:#4A3000;box-shadow:0 6px 0 #3E2F26}
  .plank.pale{background:#FBF0D8;color:#3E2F26;box-shadow:0 6px 0 #3E2F26}

  /* ---------- legen ---------- */
  .ask{text-align:center}
  .ask h2{font-size:19px;color:#EAF6FC;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .earbtn{
    margin:14px auto 20px;width:128px;height:128px;border-radius:50%;cursor:pointer;
    background:#F2C14E;color:#4A3000;display:grid;place-items:center;
    border:3.5px solid #3E2F26;box-shadow:0 8px 0 #3E2F26;
  }
  .earbtn svg{width:56px;height:56px}
  .earbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #3E2F26}
  .earbtn:focus-visible{outline:4px solid #fff;outline-offset:4px}
  .earbtn.ping{animation:ping 1s ease-in-out infinite}
  @keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .crate{
    background:#FBF0D8;
    border:4px solid #3E2F26;border-radius:16px;cursor:pointer;
    aspect-ratio:1/1;display:grid;place-items:center;font-size:60px;line-height:1;position:relative;
    box-shadow:0 5px 0 #3E2F26;transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  .crate:active{transform:translateY(3px);box-shadow:0 2px 0 #3E2F26}
  .crate:focus-visible{outline:4px solid #fff;outline-offset:3px}
  .crate.yes{background:#B7E89F;border-color:#3E2F26;background-image:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1.06)}}
  .crate.nope{background:#F6D9D3;background-image:none;border-color:#A8402F;cursor:default;animation:wob .5s ease}
  .crate.nope .em{filter:grayscale(1);opacity:.32}
  .crate.nope::after{content:"✕";position:absolute;top:0;right:11px;font-family:var(--body);
    font-size:30px;font-weight:800;color:var(--red)}
  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .crate.show{border-color:#3D8C4B;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* ---------- fejring og skattekiste ---------- */
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:40;background:var(--gold)}
  #flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.34}70%{opacity:.2}100%{opacity:0}}
  #conf{position:fixed;inset:0;pointer-events:none;z-index:41}
  .yay{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:42;
    font-family:var(--display);font-size:44px;font-weight:700;color:#FFF6E5;pointer-events:none;
    text-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
  .yay.go{animation:yay .95s cubic-bezier(.2,1.5,.4,1)}
  @keyframes yay{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    75%{opacity:1;transform:translate(-50%,-60%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-85%) scale(.95)}}
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .crew{display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .mate{width:104px;height:104px;margin-bottom:-4px;animation:cheer 1.6s ease-in-out infinite}
  .mate svg{width:100%;height:100%;display:block}
  .mate svg path:not([opacity]):not([fill="none"]),.mate svg circle:not([opacity]),
  .mate svg ellipse:not([opacity]){stroke:rgba(42,28,18,.5);stroke-width:1.5;stroke-linejoin:round;paint-order:stroke fill}
  @keyframes cheer{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-7px)}}
  .chest{width:158px;height:138px}
  .haul{display:flex;gap:11px}
  .haul svg{width:54px;height:54px;animation:drop .5s cubic-bezier(.2,1.5,.4,1) backwards}
  .haul svg:nth-child(2){animation-delay:.16s}
  .haul svg:nth-child(3){animation-delay:.32s}
  @keyframes drop{0%{transform:translateY(-40px) scale(.4) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .done h2{font-size:34px;color:#FFF6E5;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  .done p{margin:0;color:#EAF6FC;font-size:15.5px;line-height:1.55;max-width:32ch;
    text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px;margin-top:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){
    *,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
</style>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#07364C" flood-opacity=".45"/>
    </filter>
    <filter id="softS" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#07364C" flood-opacity=".4"/>
    </filter>
    <radialGradient id="gloss" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/><stop offset="45%" stop-color="#FFD97E"/><stop offset="1" stop-color="#D98F2A"/></linearGradient>
    <linearGradient id="gLagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9F2FC"/><stop offset="55%" stop-color="#5CD3EC"/><stop offset="1" stop-color="#22A6CE"/></linearGradient>
    <linearGradient id="gFoam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C6F2FC"/></linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CF0A8"/><stop offset="45%" stop-color="#4FC468"/><stop offset="1" stop-color="#1E8440"/></linearGradient>
    <linearGradient id="gLeafD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ED184"/><stop offset="50%" stop-color="#2E9E4C"/><stop offset="1" stop-color="#14602F"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5A667"/><stop offset="45%" stop-color="#B5702F"/><stop offset="1" stop-color="#67350F"/></linearGradient>
    <linearGradient id="gStraw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEEB4"/><stop offset="50%" stop-color="#EFC059"/><stop offset="1" stop-color="#C2861F"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B8"/><stop offset="40%" stop-color="#FFC93D"/><stop offset="1" stop-color="#D18B00"/></linearGradient>
    <linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6EE"/><stop offset="50%" stop-color="#A0B3C2"/><stop offset="1" stop-color="#5D7183"/></linearGradient>
    <linearGradient id="gRockD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DAFBD"/><stop offset="50%" stop-color="#6B7F8E"/><stop offset="1" stop-color="#3E505E"/></linearGradient>
    <linearGradient id="gLava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE066"/><stop offset="45%" stop-color="#FF9B2E"/><stop offset="1" stop-color="#DC2F1E"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA894"/><stop offset="45%" stop-color="#F0514A"/><stop offset="1" stop-color="#B31F22"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFE0FF"/><stop offset="45%" stop-color="#4A9BEA"/><stop offset="1" stop-color="#1B5CB0"/></linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCBDE"/><stop offset="45%" stop-color="#F97DAE"/><stop offset="1" stop-color="#CE3B78"/></linearGradient>
    <linearGradient id="gWhale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BCD9F2"/><stop offset="45%" stop-color="#6A97C8"/><stop offset="1" stop-color="#2E4F7C"/></linearGradient>

      <stop offset="0" stop-color="#B6E6FB"/><stop offset="45%" stop-color="#54AEE0"/><stop offset="1" stop-color="#1F6EAE"/></linearGradient>
    <linearGradient id="gTurtle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93E3A3"/><stop offset="45%" stop-color="#3FAE5F"/><stop offset="1" stop-color="#186435"/></linearGradient>
    <linearGradient id="gCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFA"/><stop offset="55%" stop-color="#FBEED0"/><stop offset="1" stop-color="#E7CE96"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <section id="s-map" class="screen on">
    <div class="banner">
      <div class="brand">Ord<em>jagt</em></div>
      <div class="purse"><span id="pursecoin"></span><span id="pursenum">0</span></div>
    </div>
    <p class="sub">Sejl fra ø til ø og saml guld. Klar en ø, så sejler skibet videre til den næste.</p>
    <div class="chart" id="chart"></div>
  </section>

  <section id="s-learn" class="screen">
    <div class="bar">
      <button class="back" data-home aria-label="Tilbage til søkortet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="track"><div class="fill" id="learnfill"></div></div>
    </div>
    <div class="stage">
      <div class="scroll" id="learncard" role="button" tabindex="0">
        <div class="pic" id="learnpic"></div>
        <div class="word" id="learnword"></div>
        <div class="word-da" id="learnda"></div>
        <span class="speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 010 7"/></svg>
          Tryk for at høre
        </span>
      </div>
      <button class="plank" id="learnnext">Næste</button>
    </div>
  </section>

  <section id="s-play" class="screen">
    <div class="bar">
      <button class="back" data-home aria-label="Tilbage til søkortet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="track"><div class="fill" id="playfill"></div></div>
    </div>
    <div class="ask"><h2>Hvad hører du?</h2></div>
    <button class="earbtn ping" id="ear" aria-label="Hør ordet igen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5.5 5.5 0 010 8"/><path d="M20 5.5a9.5 9.5 0 010 13"/></svg>
    </button>
    <div class="grid" id="crates"></div>
  </section>

  <section id="s-done" class="screen">
    <div class="done">
      <div class="crew">
        <div class="mate" id="mate"></div>
        <svg class="chest" id="chest" viewBox="0 0 120 104" aria-hidden="true"></svg>
      </div>
      <div class="haul" id="haul"></div>
      <h2 id="donetitle"></h2>
      <p id="donetext"></p>
      <div class="acts">
        <button class="plank gold" id="nextlvl">Sejl til næste ø</button>
        <button class="plank" id="again">Bliv på øen og prøv igen</button>
        <button class="plank pale" data-home>Tilbage til søkortet</button>
      </div>
    </div>
  </section>
</div>

<div id="flash"></div>
<canvas id="conf"></canvas>
<div class="yay" id="yay"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
const LEVELS = [

    '<path d="M24 64 q-14 6 -16 17 q12 -2 19 -8 z" fill="'+P.gold+'"/>'+
    '<ellipse cx="58" cy="66" rx="25" ry="29" fill="'+P.roof+'"/>'+
    '<path '+SH+' d="M58 37 a25 29 0 0 1 0 58 a16 29 0 0 0 0 -58 z" fill="'+P.roofS+'"/>'+
    '<path d="M48 48 q21 10 17 36 q-17 9 -25 -8 z" fill="'+P.gold+'"/>'+
    '<circle cx="60" cy="35" r="20" fill="'+P.roof+'"/>'+
    '<path '+SH+' d="M60 15 a20 20 0 0 1 0 40 a13 20 0 0 0 0 -40 z" fill="'+P.roofS+'"/>'+
    '<path d="M40 29 q20 -13 41 -2 q-6 -13 -21 -13 q-16 0 -20 15 z" fill="'+P.plum+'"/>'+
    '<path '+SH+' d="M60 14 q15 0 21 13 q-10 -6 -21 -7 z" fill="'+P.plumS+'"/>'+
    '<path d="M40 29 q-8 3 -12 10 q10 2 15 -3 z" fill="'+P.plum+'"/>'+
    '<circle cx="53" cy="35" r="7" fill="'+P.cream+'"/><circle cx="55" cy="36" r="3.4" fill="#3E2F26"/>'+
    '<circle cx="70" cy="35" r="7" fill="'+P.cream+'"/><circle cx="72" cy="36" r="3.4" fill="#3E2F26"/>'+
    '<path d="M78 43 q15 6 2 14 q-8 -6 -6 -14 z" fill="'+P.gold+'"/>'+
    '<path d="M50 95 l-6 11 M68 95 l6 11" stroke="'+P.goldS+'" stroke-width="6" stroke-linecap="round"/>'+
    '<path d="M38 106 h14 M68 106 h14" stroke="'+P.goldS+'" stroke-width="6" stroke-linecap="round"/></svg>';
}

function totalCoins(){ return Object.values(save.stars).reduce((a,b)=>a+b,0); }
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("#"+id).classList.add("on");
  window.scrollTo(0,0);
}

/* ---------- lyd ---------- */
let voice=null, ac=null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  voice = v.find(x=>x.lang==="en-GB") || v.find(x=>x.lang && x.lang.startsWith("en-GB"))
       || v.find(x=>x.lang && x.lang.startsWith("en")) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : "en-GB";
    if(voice) u.voice = voice;
    u.rate = .82; u.pitch = 1.06;
    speechSynthesis.speak(u);
  }catch(e){}
}
function tone(notes, type){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    notes.forEach((n,i)=>{
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*0.085;
      o.type = type || "triangle"; o.frequency.value = n;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.32);
    });
  }catch(e){}
}
const cheerSound = ()=>tone([523,659,784,1047]);
const softSound  = ()=>tone([392,349]);
const sailSound  = ()=>tone([392,440,523], "sine");

/* ---------- konfetti ---------- */
const cv = $("#conf"), cx = cv.getContext("2d");
let bits=[], raf=null;
const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){ cv.width=innerWidth; cv.height=innerHeight; }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function burst(){
  if(calm) return;
  const pal = ["#F2B01E","#FFD35C","#A96F06","#FFF6E5","#3E8E4E","#C0392B","#E8C27A"];
  for(let i=0;i<80;i++){
    bits.push({
      x:innerWidth/2, y:innerHeight*0.42,
      vx:(Math.random()-.5)*15, vy:Math.random()*-15-4,
      s:7+Math.random()*8, r:Math.random()*6.3, vr:(Math.random()-.5)*.35,
      c:pal[(Math.random()*pal.length)|0], life:0
    });
  }
  if(!raf) raf = requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b=>b.life<130);
  bits.forEach(b=>{
    b.life++; b.vy+=.42; b.vx*=.995; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r);
    cx.globalAlpha = Math.max(0, 1-b.life/130);
    cx.fillStyle=b.c; cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.62);
    cx.restore();
  });
  if(bits.length){ raf = requestAnimationFrame(step); }
  else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
}
function celebrate(){
  const f=$("#flash"), y=$("#yay");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  y.textContent = CHEERS[(Math.random()*CHEERS.length)|0];
  y.classList.remove("go"); void y.offsetWidth; y.classList.add("go");
  burst(); cheerSound();
}

/* ---------- søkortet ---------- */
let sailFrom = null;
function drawMap(){
  $("#pursecoin").innerHTML = coin(true);
  $("#pursenum").textContent = totalCoins();
  const box = $("#chart"); box.innerHTML="";
  const isles = [];
  LEVELS.forEach((lv,i)=>{
    const open = i < save.open;
    if(i){
      const t = document.createElement("div");
      t.className = "trail" + (open ? "" : " dim");
      t.innerHTML = '<span class="dots"><i></i><i></i><i></i><i></i></span>' +
        '<span class="deco ' + (i%2 ? "l" : "r") + '">' + DECOS[(i-1) % DECOS.length]() + '</span>';
      box.appendChild(t);
    }
    const row = document.createElement("div");
    row.className = "row" + (i%2 ? " r" : "");
    const got = save.stars[i] || 0;
    const btn = document.createElement("button");
    btn.className = "isle" + (open ? "" : " locked");
    btn.innerHTML = island(lv, i+1, open, KINDS[i % KINDS.length]);
    if(open){
      btn.setAttribute("aria-label", "Ø " + (i+1) + ": " + lv.name);
      btn.onclick = ()=>startLevel(i);
    } else {
      btn.setAttribute("aria-label", lv.name + " — låst ø");
      btn.disabled = true;
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    let coins = "";
    for(let c=0;c<3;c++) coins += coin(c<got);
    meta.innerHTML = '<span class="name">'+lv.name+'</span>' +
      (open ? '<span class="coins">'+coins+'</span>' : '<span class="hint">ukendt farvand</span>');
    row.appendChild(btn); row.appendChild(meta);
    box.appendChild(row);
    isles.push(btn);
  });

  const ship = document.createElement("div");
  ship.className = "ship"; ship.innerHTML = shipSvg();
  box.appendChild(ship);
  const here = Math.min(save.open, LEVELS.length) - 1;
  const spot = el => {
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    let left = r.left - b.left + r.width/2 - 32;
    left = Math.max(2, Math.min(left, b.width - 66));
    return [left, r.top - b.top + r.height - 26];
  };
  const park = i => { const p = spot(isles[i]); ship.style.transform = "translate("+p[0]+"px,"+p[1]+"px)"; };
  const sail = sailFrom !== null && sailFrom !== here;
  ship.style.transition = "none";
  park(sail ? sailFrom : here);
  void ship.offsetWidth;                 // lås positionen fast før vi animerer
  ship.style.transition = "";
  sailFrom = null;
  if(sail){
    requestAnimationFrame(()=>{
      park(here); sailSound();
      setTimeout(()=>ship.classList.add("bob"), 1750);
    });
  } else {
    ship.classList.add("bob");
  }
}

/* ---------- spil ---------- */
let L=null, li=0, deck=[], qi=0, miss=0, cur=null, lidx=0, busy=false;
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

function startLevel(i){
  lidx = i; L = LEVELS[i]; li = 0; miss = 0;
  tone([440]);
  show("s-learn"); drawLearn();
}
function drawLearn(){
  const w = L.words[li];
  $("#learnpic").textContent = w.pic;
  $("#learnword").textContent = w.en;
  $("#learnda").textContent = w.da;
  $("#learnfill").style.width = ((li+1)/L.words.length*100)+"%";
  $("#learnnext").textContent = li === L.words.length-1 ? "Nu skal vi lede efter guld!" : "Næste";
  say(w.en);
}
$("#learncard").onclick = ()=>say(L.words[li].en);
$("#learncard").onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); say(L.words[li].en); } };
$("#learnnext").onclick = ()=>{
  if(li < L.words.length-1){ li++; drawLearn(); }
  else { deck = shuffle(L.words.slice()); qi = 0; show("s-play"); drawQuestion(); }
};

function drawQuestion(){
  cur = deck[qi];
  $("#playfill").style.width = (qi/deck.length*100)+"%";
  const others = shuffle(L.words.filter(w=>w.en!==cur.en)).slice(0,3);
  const opts = shuffle(others.concat([cur]));
  const grid = $("#crates"); grid.innerHTML="";
  opts.forEach((o,idx)=>{
    const t = document.createElement("button");
    t.className = "crate";
    t.innerHTML = '<span class="em"></span>';
    t.firstChild.textContent = o.pic;
    t.setAttribute("aria-label", "Billede " + (idx+1) + " af 4");
    t.onclick = ()=>answer(t,o);
    grid.appendChild(t);
  });
  $("#ear").classList.add("ping");
  setTimeout(()=>say(cur.en), 260);
}
$("#ear").onclick = ()=>say(cur.en);

function answer(tile, opt){
  if(busy) return;
  if(opt.en === cur.en){
    busy = true;
    $("#ear").classList.remove("ping");
    tile.classList.add("yes");
    celebrate();
    live.textContent = "Rigtigt: " + cur.en;
    setTimeout(()=>{
      busy = false; qi++;
      if(qi < deck.length){ drawQuestion(); } else { finish(); }
    }, 1150);
  } else {
    miss++;
    softSound();
    tile.classList.add("nope");
    tile.disabled = true;
    say(cur.en);
    if(document.querySelectorAll(".crate.nope").length >= 2){
      document.querySelectorAll(".crate").forEach(t=>{
        if(t.textContent===cur.pic) t.classList.add("show");
      });
    }
  }
}

function finish(){
  $("#playfill").style.width = "100%";
  const got = miss <= 1 ? 3 : (miss <= 3 ? 2 : 1);
  save.stars[lidx] = Math.max(save.stars[lidx]||0, got);
  const first = lidx + 1 >= save.open;
  if(save.open < LEVELS.length && first) save.open = lidx + 2;
  store();
  $("#chest").innerHTML = chestSvg(true);
  $("#mate").innerHTML = mascot();
  const box = $("#haul"); box.innerHTML="";
  for(let c=0;c<3;c++) box.insertAdjacentHTML("beforeend", coin(c<got));
  $("#donetitle").textContent = got===3 ? "Hele skatten!" : (got===2 ? "Godt gået!" : "Lidt guld!");
  $("#donetext").textContent = got===3
    ? "Du ramte alt rigtigt. Nu kan du de otte ord."
    : "Bliv på øen og prøv igen, hvis du vil have alle tre mønter.";
  const more = lidx + 1 < LEVELS.length;
  $("#nextlvl").style.display = more ? "" : "none";
  $("#nextlvl").onclick = ()=>{ if(more){ sailFrom = lidx; startLevel(lidx+1); } };
  $("#again").onclick = ()=>startLevel(lidx);
  sailFrom = first ? lidx : null;
  show("s-done");
  setTimeout(()=>{ celebrate(); setTimeout(burst, 300); }, 220);
}

document.querySelectorAll("[data-home]").forEach(b=>{
  b.onclick = ()=>{ try{speechSynthesis.cancel();}catch(e){} show("s-map"); drawMap(); };
});
$("#chest").innerHTML = chestSvg(true);
$("#mate").innerHTML = mascot();
drawMap();
</script>
